name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Assemble original Blue Hour PDF
        run: |
          mkdir -p dist/assets/documents/blue-hour
          cat publication-sources/blue-hour/blue-hour.pdf.part1 publication-sources/blue-hour/blue-hour.pdf.part2 > dist/assets/documents/blue-hour/blue-hour.pdf
          echo '03ab62b667daaaf867b3af5f1d9aea34c202e0f8903148f9abee309518dd152f  dist/assets/documents/blue-hour/blue-hour.pdf' | sha256sum --check
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
